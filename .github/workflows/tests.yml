name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the packages the tests import
        run: python -m pip install psutil==7.2.2 pywin32==312
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Byte-compile everything
        run: python -m compileall -q hwblackbox tools tests
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$err)
            if ($err) { $bad++; $err | ForEach-Object { "$($f.Name):$($_.Extent.StartLineNumber): $($_.Message)" } }
          }
          if ($bad) { exit 1 }
