name: VirusTotal

# VirusTotal's verdict on a release's files: the zip and the Setup.exe in it (tools/virustotal.py). Each is looked up by
# its SHA-256, and one VirusTotal hasn't seen is uploaded and its analysis waited for (a few minutes). The run's summary
# lists every engine that flags a file; a major engine (Microsoft's, ESET's, Bitdefender's...) flagging one fails the
# run: don't publish it. For a draft, the result goes into its notes as one line under "Check the download".
#   release.yml calls it after the draft, with the run's own zip (a signing test too: no draft, so just the summary).
#   By hand (Run workflow, a tag): a release made before. A release that's out is only looked up, its notes unchanged.
# The key is the repository secret VT_API_KEY, from a free VirusTotal account (4 requests a minute, 500 a day). Files
# sent to VirusTotal are shared with its subscribers: release files only, which are public anyway.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      from_run:
        description: the calling run's HWBlackbox-release artifact, not the release's download
        type: boolean
        default: false
    secrets:
      VT_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to scan (e.g. v1.1.3); a draft gets the result in its notes
        required: true

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write       # a draft's files and notes (a draft isn't visible with read only)
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: The run's zip
        if: inputs.from_run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: HWBlackbox-release
          path: dist

      - name: The release's zip
        if: ${{ !inputs.from_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern HWBlackbox-win64.zip --dir dist

      - name: Setup.exe, from the zip
        run: unzip -j dist/HWBlackbox-win64.zip HWBlackbox/Setup.exe -d dist

      - name: Scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: python3 tools/virustotal.py scan dist/HWBlackbox-win64.zip dist/Setup.exe --line "$RUNNER_TEMP/vt-line.md"

      - name: The result in a draft's notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/vt-line.md" ] || { echo "::notice::no line for the notes: a scan didn't finish"; exit 0; }
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" != true ]; then
            echo "::notice::$TAG isn't a draft ($draft): its notes stay as they are"
            exit 0
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          python3 tools/virustotal.py notes "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/vt-line.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          echo "::notice::$TAG's draft notes: $(cat "$RUNNER_TEMP/vt-line.md")"
